<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You | R.K. Cool Services</title>
  <meta name="description" content="Thank you for booking your appliance repair service with R.K. Cool Services.">
  <meta name="author" content="R.K. Cool Services">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18100290110"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-18100290110');
  </script>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">

  <link rel="stylesheet" href="css/style.css">
  <style>
    .thankyou-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--hero-bg), #102a43);
      padding: 80px 16px 40px;
    }
    .thankyou-card {
      max-width: 480px;
      width: 100%;
      text-align: center;
      background: #fff;
      padding: 32px 20px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }
    .thankyou-card .check-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--success), #16a34a);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #fff;
      box-shadow: 0 6px 18px rgba(34, 197, 94, 0.3);
    }
    .thankyou-card .ty-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 800;
      color: var(--neutral-900);
    }
    .thankyou-card .ty-brand img {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
    }
    .thankyou-card .ty-brand span {
      color: var(--primary);
    }
    .thankyou-card h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: var(--neutral-900);
    }
    .thankyou-card p {
      color: var(--neutral-600);
      margin-bottom: 14px;
      line-height: 1.6;
      font-size: 14px;
    }
    .thankyou-card .wait-msg {
      background: #f0fdf4;
      border: 1px dashed #22c55e;
      color: #15803d;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .thankyou-card .btn-base {
      width: 100%;
      max-width: 240px;
      margin: 0 auto;
    }

    @media (max-width: 480px) {
      .thankyou-wrap {
        padding: 70px 12px 30px;
      }
      .thankyou-card {
        padding: 24px 16px;
      }
      .thankyou-card h1 {
        font-size: 22px;
      }
      .thankyou-card p {
        font-size: 13.5px;
      }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="nav-brand">
        <img src="images/logo.png" alt="R.K. Cool Services Logo">
        R.K.<span>COOL</span> SERVICES
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html#home">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#ac-services">AC Services</a>
        <a href="privacy-policy.html">Privacy Policy</a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- THANK YOU MAIN CARD -->
  <div class="thankyou-wrap">
    <div class="thankyou-card">
      <div class="ty-brand">
        <img src="images/logo.png" alt="R.K. Cool Services">
        R.K.<span>COOL</span> SERVICES
      </div>
      <div class="check-icon">&#10003;</div>
      <h1>Thank You!</h1>
      <p>Your booking request has been submitted successfully.</p>
      
      <!-- 5 Minutes Waiting Message -->
      <div class="wait-msg">
        ⚡ Our team will call you within 5 minutes. Please wait for a moment, Sir!
      </div>

      <a href="index.html" class="btn-base btn-primary">Go Back to Home</a>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
